<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spend - The Financial Editorial</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#2f4865",
                        "surface-dim": "#d8dadc",
                        "secondary-container": "#c2dcff",
                        "on-primary-container": "#79849d",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f2f4f6",
                        "surface-tint": "#545e76",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#47607e",
                        "on-tertiary-fixed-variant": "#005236",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-container": "#002113",
                        "on-surface-variant": "#44474c",
                        "surface-container-high": "#e6e8ea",
                        "on-primary": "#ffffff",
                        "on-background": "#191c1e",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#002113",
                        "primary": "#000000",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "primary-fixed-dim": "#bbc6e2",
                        "outline": "#74777d",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "inverse-primary": "#bbc6e2",
                        "secondary-fixed": "#d1e4ff",
                        "tertiary-fixed": "#6ffbbe",
                        "tertiary": "#000000",
                        "on-error": "#ffffff",
                        "outline-variant": "#c4c6cc",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#001d36",
                        "on-primary-fixed": "#101b30",
                        "inverse-surface": "#2d3133",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-fixed-dim": "#afc9ea",
                        "on-tertiary-container": "#009668",
                        "background": "#f7f9fb",
                        "on-secondary-container": "#48617e",
                        "primary-container": "#101b30",
                        "surface-variant": "#e0e3e5",
                        "surface": "#f7f9fb",
                        "primary-fixed": "#d7e2ff",
                        "on-surface": "#191c1e",
                        "on-primary-fixed-variant": "#3c475d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, .font-headline {
            font-family: 'Manrope', sans-serif;
        }
        .editorial-input:focus {
            outline: none;
            border-bottom-color: #009668;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Non-Shell Page) -->
<header class="flex justify-between items-center w-full px-8 py-10">
<div class="font-headline font-black text-3xl tracking-tighter text-primary dark:text-white">
            Spend
        </div>
</header>
<main class="flex-grow flex items-center justify-center px-6 pb-20">
<div class="w-full max-w-md">
<!-- Hero Typography -->
<div class="mb-12">
<h1 class="text-primary dark:text-white text-5xl font-extrabold tracking-tight mb-2 leading-none">
                    Welcome <br/>Back.
                </h1>
<p class="text-secondary font-body text-sm max-w-[240px] leading-relaxed opacity-70">
                    Access your digital ledger and track your financial evolution.
                </p>
</div>
<!-- Login Form -->
<form class="space-y-10">
<div class="space-y-8">
<!-- Email Input -->
<div class="relative">
<label class="block text-on-surface-variant font-label text-[10px] font-bold tracking-[0.15em] uppercase mb-1">
                            Email Address
                        </label>
<input autocomplete="email" class="editorial-input w-full bg-transparent border-0 border-b-2 border-surface-container-highest py-3 px-0 font-body text-lg text-primary focus:ring-0 transition-all duration-300" placeholder="name@domain.com" type="email"/>
</div>
<!-- Password Input -->
<div class="relative">
<div class="flex justify-between items-end mb-1">
<label class="block text-on-surface-variant font-label text-[10px] font-bold tracking-[0.15em] uppercase">
                                Security Code
                            </label>
<a class="text-secondary font-label text-[10px] font-bold tracking-tight hover:text-primary transition-colors" href="#">
                                Forgot Password?
                            </a>
</div>
<input autocomplete="current-password" class="editorial-input w-full bg-transparent border-0 border-b-2 border-surface-container-highest py-3 px-0 font-body text-lg text-primary focus:ring-0 transition-all duration-300" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full py-5 bg-primary text-on-primary font-headline font-bold text-sm tracking-widest uppercase rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="submit">
                        Enter Vault
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Social/Secondary Actions -->
<div class="mt-16 space-y-8">
<div class="flex items-center gap-4">
<div class="h-[1px] flex-grow bg-surface-container-highest"></div>
<span class="text-on-surface-variant font-label text-[10px] tracking-widest uppercase">Or continue with</span>
<div class="h-[1px] flex-grow bg-surface-container-highest"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-4 border border-outline-variant/30 rounded-lg font-body text-sm font-medium hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
<button class="flex items-center justify-center gap-3 py-4 border border-outline-variant/30 rounded-lg font-body text-sm font-medium hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5 fill-primary" viewbox="0 0 24 24">
<path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.671-1.48 3.671-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.605 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.702z"></path>
</svg>
                        Apple
                    </button>
</div>
<!-- Footer Link -->
<div class="text-center pt-8">
<p class="text-on-surface-variant font-body text-sm">
                        Don't have an account? 
                        <a class="text-primary font-bold ml-1 hover:underline underline-offset-4" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</main>
<!-- Visual Ledger Accent -->
<div class="fixed bottom-0 left-0 w-full overflow-hidden pointer-events-none opacity-20 select-none">
<div class="flex justify-between items-baseline px-8 py-2">
<span class="font-headline font-black text-[120px] leading-none text-surface-container-highest tracking-tighter">€</span>
<span class="font-headline font-black text-[80px] leading-none text-surface-container-highest tracking-tighter">LEK</span>
</div>
</div>
</body></html>
