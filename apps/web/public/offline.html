<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>SwiftSpend offline</title>
    <style>
      :root {
        color: #0f172a;
        background: #f8fafc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(100% - 48px, 420px);
      }

      img {
        width: 64px;
        height: 64px;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.svg" alt="" />
      <h1>You are offline</h1>
      <p>SwiftSpend can reopen cached screens, but fresh expense data needs a network connection.</p>
    </main>
  </body>
</html>
